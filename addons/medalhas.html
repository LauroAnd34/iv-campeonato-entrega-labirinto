<!-- medalhas:inicio · ouro, prata e bronze nas classificações (telão e coordenação) -->
<style id="medalhas-css">
.medal{display:inline-grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;font-family:var(--f-mono);font-weight:700;line-height:1;position:relative;
  box-shadow:inset 0 -.12em 0 rgba(0,0,0,.28),inset 0 .1em 0 rgba(255,255,255,.55),0 .08em .25em rgba(0,0,0,.35)}
.medal::after{content:"";position:absolute;inset:.18em;border-radius:50%;border:.07em solid rgba(255,255,255,.45)}
.medal.m1{background:radial-gradient(circle at 34% 28%,#fff6c2 0,#f5cd3a 38%,#c9971a 72%,#9c6f0c 100%);color:#4a3400}
.medal.m2{background:radial-gradient(circle at 34% 28%,#ffffff 0,#d9dde3 38%,#a7afba 72%,#7c8591 100%);color:#2b313a}
.medal.m3{background:radial-gradient(circle at 34% 28%,#ffe0c2 0,#d98f4e 38%,#b06a2c 72%,#80461a 100%);color:#2e1606}
tr.med1>td{background:rgba(245,205,58,.13)}
tr.med2>td{background:rgba(190,198,208,.14)}
tr.med3>td{background:rgba(217,143,78,.13)}
tr.med1>td:first-child{box-shadow:inset 5px 0 0 #f5cd3a!important}
tr.med2>td:first-child{box-shadow:inset 5px 0 0 #b9c1cc!important}
tr.med3>td:first-child{box-shadow:inset 5px 0 0 #cd7f32!important}
body.tv .medal{font-size:.95em}
body:not(.tv) .medal{font-size:15px}
@media (prefers-reduced-motion:no-preference){tr.med1 .medal{animation:medalshine 3.5s ease-in-out infinite}}
@keyframes medalshine{0%,80%,100%{filter:none}88%{filter:brightness(1.25)}}
</style>
<script id="medalhas-js">
/* Medalhas: as 3 primeiras colocações com pontos (total maior que 0) ganham ouro, prata e bronze; sem pontos não há pódio.
   Funciona nos três sites (Entrega, Labirinto e Carros), no telão e na tela de classificação da coordenação. */
(function(){
  const CLS=['classif','classifc'];
  function decorate(){
    const tv=document.body.classList.contains('tv');
    const tables=tv?document.querySelectorAll('.tvcar table'):(CLS.includes(typeof ui!=='undefined'&&ui?ui.step:'')?document.querySelectorAll('main table'):[]);
    tables.forEach(tb=>{tb.querySelectorAll('tbody tr').forEach(tr=>{
      const td=tr.querySelector('td');if(!td||tr.dataset.med)return;
      const n=parseInt((td.textContent||'').trim(),10);
      /* sem pontos não há pódio: a coluna Total é a 5ª nas tabelas de classificação dos três sites */
      const tot=parseInt(((tr.children[4]||{}).textContent||'').trim(),10);
      if(n>=1&&n<=3&&/^\d+$/.test(td.textContent.trim())&&tot>0){tr.classList.add('med'+n);tr.dataset.med=n;td.innerHTML='<span class="medal m'+n+'" title="'+['','Ouro','Prata','Bronze'][n]+'">'+n+'</span>'}})})}
  ['renderApp','renderTV'].forEach(fn=>{const orig=window[fn];if(typeof orig!=='function')return;window[fn]=function(){const r=orig.apply(this,arguments);try{decorate()}catch(e){}return r}});
  decorate();
})();
</script>
